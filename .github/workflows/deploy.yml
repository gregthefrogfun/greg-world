name: deploy gregthefrog.fun
on:
  push:
    branches: [main]
    paths: ["site/**", "build-fun.py", ".github/workflows/deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build-fun.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx -y netlify-cli@17.38.1 deploy --dir=fun --prod --site=48a83aba-0294-40fb-81f3-fbeffd593e18 --auth=${{ secrets.NETLIFY_AUTH_TOKEN || secrets.GREG1 }} --message "${{ github.sha }}"
