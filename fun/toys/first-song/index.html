<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lily Pad Groove</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2b2540; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
  button { font: 900 20px system-ui; padding: 16px 28px; border: 4px solid #141218; border-radius: 14px; background: #b6e452; box-shadow: 4px 4px 0 #141218; cursor: pointer; }
  p { font-weight: 700; opacity: .85; }
</style>
</head>
<body>
<main>
  <h1>Lily Pad Groove</h1>
  <p>Greg's first song. Written in code. Mastered on Freg Island.</p>
  <button id="play">▶ Play</button>
  <p style="font-size:13px">"Possibly the best song ever written on a lily pad." Greg, about Greg.</p>
</main>
<script>
// The song is data: [midi note, beats]. 0 means rest.
const SONG = {
  bpm: 104,
  lead: [[69,.5],[72,.5],[74,1],[76,.5],[74,.5],[72,1],[69,.5],[67,.5],[69,2],[0,.5],[72,.5],[76,.5],[79,1],[76,.5],[74,.5],[72,1],[74,.5],[72,.5],[69,2]],
  bass: [[45,2],[45,2],[50,2],[52,2],[45,2],[48,2],[50,2],[52,2]],
};
const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
document.getElementById('play').onclick = () => {
  const ac = new AudioContext(), beat = 60 / SONG.bpm;
  const voice = (notes, type, vol) => { let t = ac.currentTime + 0.05; for (const [m, b] of notes) { if (m) { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = mtof(m); g.gain.setValueAtTime(vol, t); g.gain.setTargetAtTime(0, t + b * beat * 0.8, 0.05); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + b * beat + 0.2); } t += b * beat; } };
  voice(SONG.lead, 'square', 0.08); voice(SONG.bass, 'triangle', 0.18);
};
</script>
</body>
</html>
